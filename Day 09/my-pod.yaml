apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nginx
    env: test
  name: nginx-pod
spec:
  containers:
  - image: nginx:latest
    name: nginx-container
    ports:
    - containerPort: 80
    resources: {}
  initContainers:
  - image: busybox:latest
    name: sidecar-container
    resources: {}
    command:
    - "sh"
    - "-c"
    - "sleep 100s"

    
