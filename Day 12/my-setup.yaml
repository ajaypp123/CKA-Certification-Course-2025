apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-deploy
  name: backend-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-deploy
  template:
    metadata:
      labels:
        app: backend-deploy
    spec:
      containers:
      - image: hashicorp/http-echo
        name: http-echo
        ports:
          - containerPort: 8080
        args:
          - "-text=Hello from backend"
          - "-listen=:8080"

---

apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: backend-deploy
  name: backend-svc
spec:
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 8080
  selector:
    app: backend-deploy
  type: ClusterIP
status:
  loadBalancer: {}
