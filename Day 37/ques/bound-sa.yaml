apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-bound-sa
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bound-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bound-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bound-role
subjects:
- kind: ServiceAccount
  name: test-bound-sa
  namespace: testsa
---


apiVersion: v1
kind: Pod
metadata:
  labels:
    run: kubectl-pod
  name: kubectl-pod
spec:
  serviceAccountName: test-bound-sa
  containers:
  - image: bitnami/kubectl:latest
    command: ["sleep", "infinity"]
    name: kubectl-pod
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}

---

