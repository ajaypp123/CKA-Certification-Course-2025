apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-bound-sa
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bound-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bound-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bound-role
subjects:
- kind: ServiceAccount
  name: test-bound-sa
  namespace: testsa
---


apiVersion: v1
kind: Secret
metadata:
  name: legacy-sc-token
  annotations:
    kubernetes.io/service-account.name: test-bound-sa
type: kubernetes.io/service-account-token

---






