apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deploy
  name: nginx-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      volumes:
      - name: host-vol
        hostPath:
          path: /tmp/
          type: Directory
      containers:
      - image: nginx
        name: nginx
        resources: {}
        volumeMounts:
        - name: host-vol
          mountPath: /data
          readOnly: true
status: {}
