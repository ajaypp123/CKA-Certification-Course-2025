apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deploy
  name: nginx-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-deploy
    spec:
      tolerations:
      - key: "color"
        value: "blue"
        operator: "Equal"
        effect: "NoSchedule"
      containers:
      - image: nginx
        name: nginx
        resources: {}

