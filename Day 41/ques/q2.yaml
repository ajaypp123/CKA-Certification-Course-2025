apiVersion: v1
kind: Pod
metadata:
  labels:
    run: busybox-pod
  name: busybox-pod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 2000
  containers:
  - image: busybox
    name: busybox-pod
    resources: {}
    command: ["sleep", "infinity"]
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
