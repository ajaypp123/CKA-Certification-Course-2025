apiVersion: v1
kind: Pod
metadata:
  labels:
    run: busybox-pod
  name: busybox-pod
spec:
  volumes:
  - name: test-vol
    emptyDir: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
  containers:
  - image: busybox
    name: busybox-pod
    resources: {}
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: test-vol
      mountPath: /test
    securityContext:
      allowPrivilegeEscalation: false 
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
