apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
spec:
  limits:
  - default: # this section defines default limits
      cpu: 500m
      memory: 512Mi
    defaultRequest: # this section defines default requests
      cpu: 100m
      memory: 128Mi
    type: Container

---

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
spec:
  hard:
    requests.cpu: 1
    requests.memory: 1Gi
    limits.cpu: 1
    requests.memory: 1Gi

---


